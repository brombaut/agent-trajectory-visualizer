<!doctype html>
<meta charset="utf-8">
<title>Agent trajectories</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; scrollbar-color: #3a3f48 transparent; }
  body { margin: 0; height: 100vh; display: flex; background: #14161a; color: #d6d9de;
         font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
  aside { width: 340px; flex: none; display: flex; flex-direction: column; border-right: 1px solid #2a2e35; }
  #proj, #q { margin: 8px 8px 0; padding: 6px 8px; background: #1c1f25; color: inherit; border: 1px solid #2a2e35; border-radius: 4px; font: inherit; }
  #proj summary { display: block; padding: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #projs { max-height: 50vh; overflow-y: auto; margin-top: 6px; }
  #projs label { display: flex; gap: 6px; align-items: center; cursor: pointer; white-space: nowrap; }
  .sw { flex: none; width: 10px; height: 10px; border-radius: 2px; background: hsl(var(--h) 60% 55%); }
  #list { overflow-y: auto; flex: 1; margin-top: 8px; }
  /* --h is the project hue, set on session rows and on panes */
  .s { padding: 6px 10px; cursor: pointer; border-left: 3px solid hsl(var(--h) 60% 55% / .5); background: hsl(var(--h) 60% 55% / .08); }
  .s:hover { background: hsl(var(--h) 60% 55% / .16); }
  .s.active { background: hsl(var(--h) 60% 55% / .3); border-left-color: #6ea8fe; }
  .s .ti, .ph .ti { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .s .sub { color: #7d8590; font-size: 11px; display: flex; gap: 6px; }
  .s .sub .cwd { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .src { font-size: 10px; padding: 0 4px; border-radius: 3px; background: #2a2e35; }
  .src.claude { color: #e8a87c; } .src.opencode { color: #7cc4e8; }
  .live { color: #5fd38d; }
  main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  header { display: flex; gap: 12px; align-items: center; justify-content: flex-end; padding: 8px 12px; border-bottom: 1px solid #2a2e35; }
  button { font: inherit; color: inherit; background: #232831; border: 1px solid #2a2e35; border-radius: 4px; padding: 3px 10px; cursor: pointer; }
  #panes { flex: 1; min-height: 0; display: flex; }
  #panes:empty::before { content: 'Select a session'; padding: 12px; color: #7d8590; }
  .pane { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
  .grip { position: absolute; left: -3px; top: 0; bottom: 0; width: 6px; z-index: 1; cursor: col-resize; }
  .grip:hover { background: #6ea8fe55; }
  .pane:first-child .grip { display: none; }
  body > .grip { position: relative; left: 0; flex: none; margin: 0 -3px; }
  .pane + .pane { border-left: 1px solid #2a2e35; }
  .ph { display: flex; gap: 8px; align-items: center; padding: 4px 12px; border-bottom: 1px solid #2a2e35;
        background: hsl(var(--h) 60% 55% / .3); }
  .ph .ti { flex: 1; }
  .events { flex: 1; overflow-y: auto; padding: 8px 12px 40px; background: hsl(var(--h) 60% 55% / .06); }
  .ev { border-left: 3px solid #444; margin: 2px 0; background: #191c21; border-radius: 0 4px 4px 0; }
  .ev.user { border-color: #6ea8fe; margin-top: 14px; background: #1a2130; }
  .ev.assistant { border-color: #5fd38d; }
  .ev.thinking { border-color: #b08cf0; opacity: .8; }
  .ev.tool { border-color: #e0b354; }
  .ev.err { border-color: #f0706a; }
  .ev.meta { display: none; opacity: .6; }
  .show-meta .ev.meta { display: block; }
  summary { display: flex; gap: 10px; padding: 4px 8px; cursor: pointer; list-style: none; }
  summary::-webkit-details-marker { display: none; }
  summary:hover { background: #ffffff0a; }
  .k { flex: none; width: 110px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
  .user .k { color: #6ea8fe; } .assistant .k { color: #5fd38d; } .thinking .k { color: #b08cf0; }
  .tool .k { color: #e0b354; } .err .k, .err .r { color: #f0706a; }
  .t, .r { flex: none; color: #7d8590; }
  .b { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  [open] > summary .b { color: #7d8590; }
  .body { padding: 4px 10px 10px 128px; cursor: pointer; }
  h4 { margin: 8px 0 2px; font-size: 11px; color: #7d8590; font-weight: 400; text-transform: uppercase; }
  pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; cursor: auto; }
  h4 + pre { background: #101216; padding: 6px 8px; border-radius: 4px; max-height: 60vh; overflow: auto; }
</style>

<aside>
  <details id="proj"><summary></summary><div id="projs"></div></details>
  <input id="q" placeholder="filter sessions…">
  <div id="list"></div>
</aside>
<div class="grip"></div>
<main>
  <header>
    <label><input type="checkbox" id="meta"> meta</label>
    <button id="expand">Expand all</button>
  </header>
  <div id="panes"></div>
</main>

<script>
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
};

let sessions = [], projects = new Set() /* cwds to list; empty = all */, expanded = false;
const panes = [];   // open sessions, one column each: {s, cursor, byId: event id -> {e, json, node}, node, box, ti}

const ago = ms => {
  const s = (Date.now() - ms) / 1000;
  return s < 60 ? 'now' : s < 3600 ? `${s / 60 | 0}m` : s < 86400 ? `${s / 3600 | 0}h` : `${s / 86400 | 0}d`;
};
const key = s => `${s.source}/${s.id}`;
const pane = s => panes.find(p => key(p.s) === key(s));
const adding = ev => ev.ctrlKey || ev.metaKey;   // Ctrl/Cmd+click adds a column instead of replacing

const hue = p => {   // a project's colour: hashed from its path, so it never changes
  let h = 0;
  for (const c of p) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return h % 360;
};
const title = s => (s.waiting ? '🔔 ' : '') + (s.depth ? '↳ ' : '') + s.title;   // bell: waiting for the human

const stamp = ms => Date.now() - ms < 60e3 ? el('span', 'live', '● live') : el('span', '', ago(ms));

function renderProjects() {
  const groups = new Map();
  for (const s of sessions) {
    const g = groups.get(s.project) ?? { cwd: s.project, n: 0, updated: 0 };
    g.n += !s.depth;
    g.updated = Math.max(g.updated, s.updated);
    groups.set(s.project, g);
  }
  const rows = [...groups.values()].sort((a, b) => b.updated - a.updated);
  for (const p of projects) if (!groups.has(p)) projects.delete(p);   // no sessions left
  const name = cwd => cwd.split('/').pop() || '(unknown)';
  $('proj').firstElementChild.textContent = '▾ ' + (projects.size
    ? rows.filter(g => projects.has(g.cwd)).map(g => name(g.cwd)).join(', ')
    : `All projects (${rows.reduce((n, g) => n + g.n, 0)})`);
  const box = $('projs'), sig = rows.map(g => g.cwd + g.n).join();
  if (box.dataset.sig !== sig) {   // rebuilt only on change, to keep its scroll position and focus
    box.dataset.sig = sig;
    box.replaceChildren(...rows.map(g => {
      const l = el('label'), c = el('input'), sw = el('span', 'sw');
      c.type = 'checkbox';
      c.onchange = () => { projects[c.checked ? 'add' : 'delete'](g.cwd); renderList(); };
      sw.style.setProperty('--h', hue(g.cwd));
      l.append(c, sw, `${name(g.cwd)} (${g.n})`);
      l.title = g.cwd;
      return l;
    }));
  }
  rows.forEach((g, i) => box.children[i].firstChild.checked = projects.has(g.cwd));
}

function renderList() {
  renderProjects();
  const q = $('q').value.toLowerCase();
  $('list').replaceChildren(...sessions
    .filter(s => !projects.size || projects.has(s.project))
    .filter(s => (s.title + s.cwd).toLowerCase().includes(q))
    .map(s => {
      const d = el('div', 's' + (pane(s) ? ' active' : ''));
      d.style.setProperty('--h', hue(s.project));
      d.style.paddingLeft = 10 + s.depth * 16 + 'px';
      const sub = el('div', 'sub');
      sub.append(el('span', 'src ' + s.source, s.source), el('span', 'cwd', s.cwd.split('/').slice(-2).join('/')),
                 stamp(s.updated));
      d.append(el('div', 'ti', title(s)), sub);
      d.title = s.title;
      d.onclick = ev => adding(ev) ? toggle(s) : select(s);
      return d;
    }));
}

async function loadSessions() {
  sessions = await (await fetch('/api/sessions')).json();
  // Subagents follow their parent's project (the list arrives parent-first).
  let root;
  for (const s of sessions) s.project = (s.depth ? root : root = s).cwd;
  if (!panes.length && location.hash) {
    const h = location.hash.slice(1), find = k => sessions.find(s => key(s) === decodeURIComponent(k));
    const whole = find(h);   // old single-session hashes were not encoded, so may contain a comma
    const found = whole ? [whole] : h.split(',').map(find).filter(Boolean);
    if (found.length) {
      projects = new Set(found.every(s => s.project === found[0].project) ? [found[0].project] : []);
      found.forEach(openPane);
      return sync();
    }
  }
  let gone = false;
  for (const p of [...panes]) {   // a session that vanished drops its column; the rest carry on
    const s = sessions.find(s => key(s) === key(p.s));
    if (s) p.ti.textContent = `${title(p.s = s)}  ·  ${s.cwd}`; else { closePane(p); gone = true; }
  }
  gone ? sync() : renderList();
}

function openPane(s) {
  const p = { s, cursor: 0, byId: new Map(), node: el('div', 'pane'), box: el('div', 'events'),
              ti: el('span', 'ti', `${title(s)}  ·  ${s.cwd}`) };
  const head = el('div', 'ph'), x = el('button', '', '×');
  x.title = 'Close';
  x.onclick = () => { closePane(p); sync(); };
  head.append(p.ti, x);
  const grip = el('div', 'grip');   // drag a column's left edge to trade width with the column before it
  grip.onpointerdown = ev => {
    const a = p.node.previousElementSibling, b = p.node, wa = a.offsetWidth, wb = b.offsetWidth, x = ev.clientX;
    const grow = +getComputedStyle(a).flexGrow + +getComputedStyle(b).flexGrow;   // widths follow flex-grow
    grip.setPointerCapture(ev.pointerId);
    ev.preventDefault();   // no text selection while dragging
    grip.onpointermove = ev => {
      const d = Math.max(80 - wa, Math.min(wb - 80, ev.clientX - x));   // keep both at least 80px wide
      a.style.flexGrow = grow * (wa + d) / (wa + wb);
      b.style.flexGrow = grow * (wb - d) / (wa + wb);
    };
  };
  grip.onpointerup = () => grip.onpointermove = null;
  p.node.style.setProperty('--h', hue(s.project));
  p.node.append(grip, head, p.box);
  $('panes').append(p.node);
  panes.push(p);
  poll(p).catch(console.error);
}

function closePane(p) {
  p.node.remove();
  panes.splice(panes.indexOf(p), 1);
}

function select(s) {
  [...panes].forEach(closePane);
  openPane(s);
  sync();
}

function toggle(s) {
  const p = pane(s);
  p ? closePane(p) : openPane(s);
  sync();
}

function sync() {
  location.hash = panes.map(p => encodeURIComponent(key(p.s))).join(',');
  renderList();
}

async function poll(p) {
  const first = p.cursor === 0;
  const r = await fetch(`/api/events?source=${p.s.source}&id=${encodeURIComponent(p.s.id)}&cursor=${p.cursor}`);
  if (!r.ok) throw new Error(await r.text());
  const data = await r.json();
  if (!panes.includes(p)) return;   // closed mid-request
  p.cursor = data.cursor;
  const box = p.box;
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  data.events.forEach(e => upsert(p, e));
  if (first || atBottom) box.scrollTop = box.scrollHeight;   // follow live output unless this column is scrolled up
}

function upsert(p, e) {
  if (e.kind === 'result') {   // Claude logs tool results as separate records; fold into the call
    const call = p.byId.get(e.tool);
    e = call ? { ...call.e, output: e.output, error: e.error }
             : { ...e, kind: 'tool', name: 'tool result' };
  }
  const old = p.byId.get(e.id), json = JSON.stringify(e);
  if (old && old.json === json) return;
  const node = row(e);
  if (old) { node.open = old.node.open; old.node.replaceWith(node); }
  else p.box.append(node);
  p.byId.set(e.id, { e, json, node });
}

function brief(e) {
  if (e.kind !== 'tool') return (e.text || '').trim().slice(0, 400);
  const i = e.input || {};
  const arg = i.description ?? i.command ?? i.file_path ?? i.filePath ?? i.path ?? i.pattern ?? i.url ?? i.query
    ?? i.prompt ?? Object.values(i).find(v => typeof v === 'string') ?? '';
  return String(arg).slice(0, 400);
}

function time(ts) {
  const t = el('span', 't', ts ? new Date(ts).toLocaleTimeString() : '');
  if (ts) t.title = new Date(ts).toLocaleString();
  return t;
}

function row(e) {
  const d = el('details', `ev ${e.kind}${e.error ? ' err' : ''}`);
  const s = el('summary');
  s.append(el('span', 'k', e.kind === 'tool' || !['user', 'assistant', 'thinking'].includes(e.kind) ? e.name || e.kind : e.kind),
           time(e.ts),
           el('span', 'b', brief(e)));
  if (e.kind === 'tool')
    s.append(el('span', 'r', e.output == null ? 'running…'
      : `${e.error ? '✗' : '✓'} ${e.output ? e.output.split('\n').length : 0} lines`));
  d.append(s);
  // Bodies can be huge; build them only when first opened.
  d.addEventListener('toggle', () => { if (d.open && d.children.length === 1) d.append(body(e)); });
  // Clicking the expanded area around the content collapses it (but not while selecting text).
  d.addEventListener('click', ev => {
    if (ev.target.closest('.body') && !ev.target.closest('pre') && !getSelection().toString()) d.open = false;
  });
  d.open = expanded;
  return d;
}

function body(e) {
  const b = el('div', 'body');
  const sec = (label, v) => {
    if (v == null || v === '') return;
    if (label) b.append(el('h4', '', label));
    b.append(el('pre', '', typeof v === 'string' ? v : JSON.stringify(v, null, 2)));
  };
  sec(null, e.text);
  if (e.kind === 'tool') {
    // description first: it gives context before the command itself
    const input = Object.entries(e.input || {}).sort(([a], [b]) => (b === 'description') - (a === 'description'));
    for (const [k, v] of input) sec('input · ' + k, v);
    sec(e.error ? 'error' : 'output', e.output ?? '(no result yet)');
  }
  sec('details', e.extra);
  return b;
}

$('q').oninput = renderList;
for (const grip of document.querySelectorAll('body > .grip')) {   // drag to set the width of the sidebar before it
  grip.onpointerdown = ev => {
    const a = grip.previousElementSibling, w = a.offsetWidth, x = ev.clientX;
    grip.setPointerCapture(ev.pointerId);
    ev.preventDefault();
    grip.onpointermove = ev => a.style.width = Math.max(80, w + ev.clientX - x) + 'px';
  };
  grip.onpointerup = () => grip.onpointermove = null;
}
$('meta').onchange = e => $('panes').classList.toggle('show-meta', e.target.checked);
$('expand').onclick = () => {
  expanded = !expanded;
  $('expand').textContent = expanded ? 'Collapse all' : 'Expand all';
  for (const p of panes) for (const { node } of p.byId.values()) node.open = expanded;
};

async function loop(fn, ms) {
  try { await fn(); } catch (err) { console.error(err); }
  setTimeout(loop, ms, fn, ms);
}
loop(loadSessions, 5000);
loop(() => Promise.all(panes.map(p => poll(p).catch(console.error))), 1500);
</script>
