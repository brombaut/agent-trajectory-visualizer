<!doctype html>
<meta charset="utf-8">
<title>Agent trajectories</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; scrollbar-color: #aaa transparent; }
  body { margin: 0; height: 100vh; display: flex; background: #d6d6d6; color: #111;
         font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
  aside { width: 340px; flex: none; display: flex; flex-direction: column; border-right: 1px solid #b4b4b4; }
  #proj, #q { margin: 8px 8px 0; padding: 6px 8px; background: #e4e4e4; color: inherit; border: 1px solid #b4b4b4; border-radius: 4px; font: inherit; }
  #proj summary { display: block; padding: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #projs { max-height: 50vh; overflow-y: auto; margin-top: 6px; }
  #projs label { display: flex; gap: 6px; align-items: center; cursor: pointer; white-space: nowrap; }
  /* --h is the project hue, set on swatches, session rows and panes; --p is that project's plastics colour.
     A project with a colour in the config file gets --p set directly instead. */
  .sw, .s, .pane { --p: oklch(.85 .3 var(--h)); }
  .sw { flex: none; width: 10px; height: 10px; border-radius: 2px; background: var(--p); }
  #list { overflow-y: auto; flex: 1; margin-top: 8px; }
  .s { padding: 6px 10px; cursor: pointer; border-left: 6px solid var(--p); border-bottom: 1px solid #c6c6c6; }
  .s:hover { background: #c8c8c8; }
  .s.active, .s.active * { background: var(--p); color: #000; }
  .s .ti, .ph .ti { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .s .sub { color: #595959; font-size: 11px; display: flex; gap: 6px; }
  .s .sub .cwd { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .src { font-size: 10px; padding: 0 4px; border-radius: 3px; background: #c6c6c6; }
  /* brand colours; .s raises these over the selected row's .s.active * */
  .s .src.claude { background: #d97757; color: #fff; }
  .s .src.codex { background: #10a37f; color: #fff; }
  .s .src.opencode { background: #211e1e; color: #fff; }
  .live { color: #0b8a00; }
  main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  header { display: flex; gap: 12px; align-items: center; justify-content: flex-end; padding: 8px 12px; border-bottom: 1px solid #b4b4b4; }
  button { font: inherit; color: inherit; background: #e4e4e4; border: 1px solid #b4b4b4; border-radius: 4px; padding: 3px 10px; cursor: pointer; }
  #panes { flex: 1; min-height: 0; display: flex; }
  #panes:empty::before { content: 'Select a session'; padding: 12px; color: #595959; }
  .pane { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
  .grip { position: absolute; left: -3px; top: 0; bottom: 0; width: 6px; z-index: 1; cursor: col-resize; }
  .grip:hover { background: #0003; }
  .pane:first-child .grip { display: none; }
  body > .grip { position: relative; left: 0; flex: none; margin: 0 -3px; }
  .pane + .pane { border-left: 1px solid #b4b4b4; }
  .focus aside, .focus .grip, .focus .pane:not(.focused) { display: none; }   /* one pane alone, full width */
  .ph { display: flex; gap: 8px; align-items: center; padding: 4px 12px; border-bottom: 1px solid #b4b4b4;
        background: var(--p); color: #000; font-weight: 600; }
  .ph button { background: none; border-color: #0005; }
  .ph .ti { flex: 1; }
  .tl { padding: 2px 12px; border-bottom: 1px solid #b4b4b4; color: #595959; font-size: 11px;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }   /* where the time went: summary() */
  .tl:empty { display: none; }
  .pane { container-type: inline-size; }   /* the strip shows only in panes wide enough to read it */
  .strip { padding: 4px 12px; border-bottom: 1px solid #b4b4b4; }
  .strip:empty { display: none; }
  @container (max-width: 500px) { .strip { display: none; } }
  .strip svg { display: block; width: 100%; height: 40px; }
  .strip rect { cursor: pointer; }
  /* the turn type colours: model as the assistant, tools as tool calls, you as user messages */
  .strip .model { fill: #4dff4d; }
  .strip .tools { fill: #ff9a1f; }
  .strip .err { fill: #ff3b3b; }
  .strip .you { fill: #e6ff00; }
  .strip .background { fill: #9a9a9a; }
  .strip .idle { fill: #0000001a; }
  .strip .ctx { fill: none; stroke: #333; vector-effect: non-scaling-stroke; }
  .strip .view { fill: #0000000d; stroke: #000a; vector-effect: non-scaling-stroke; pointer-events: none; }
  .events { flex: 1; overflow-y: auto; padding: 8px 12px 40px; }
  /* --k is the turn type colour: the same in every project */
  .ev { --k: #c6c6c6; border-left: 4px solid var(--k); margin: 2px 0; background: #e4e4e4; border-radius: 0 4px 4px 0; }
  .ev.user { --k: #e6ff00; margin-top: 14px; background: #f0f7a6; }
  .ev.assistant { --k: #4dff4d; }
  .ev.thinking { --k: #ff6bd6; opacity: .8; }
  .ev.tool { --k: #ff9a1f; }
  .ev.err { --k: #ff3b3b; }
  .ev.meta { display: none; opacity: .6; }
  .show-meta .ev.meta { display: block; }
  summary { display: flex; gap: 10px; padding: 4px 8px; cursor: pointer; list-style: none; }
  summary::-webkit-details-marker { display: none; }
  summary:hover { background: #0000000a; }
  .k { flex: none; width: 110px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; background: var(--k); padding: 0 6px; border-radius: 2px; }
  .tool:not(.err) .k { background: none; }   /* most rows are tools: a stripe only, so the other types stand out */
  .err .r { color: #d4001a; }
  .t, .r { flex: none; color: #595959; }
  .b { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  [open] > summary .b { color: #595959; }
  .body { padding: 4px 10px 10px 128px; cursor: pointer; }
  h4 { margin: 8px 0 2px; font-size: 11px; color: #595959; font-weight: 400; text-transform: uppercase; }
  pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; cursor: auto; }
  h4 + pre { background: #d8d8d8; padding: 6px 8px; border-radius: 4px; max-height: 60vh; overflow: auto; }
</style>

<aside>
  <details id="proj"><summary></summary><div id="projs"></div></details>
  <input id="q" placeholder="filter sessions…">
  <div id="list"></div>
</aside>
<div class="grip"></div>
<main>
  <header>
    <label><input type="checkbox" id="meta"> meta</label>
    <button id="live" title="Open every running top-level session in the list; close the other panes">Open live</button>
    <button id="expand">Expand all</button>
  </header>
  <div id="panes"></div>
</main>

<script>
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
};

let sessions = [], projects = new Set() /* cwds to list; empty = all */, expanded = false, focused = null;
const panes = [];   // open sessions, one column each: {s, cursor, byId: event id -> {e, json, node}, node, box, ti}

const ago = ms => {
  const s = (Date.now() - ms) / 1000;
  return s < 60 ? 'now' : s < 3600 ? `${s / 60 | 0}m` : s < 86400 ? `${s / 3600 | 0}h` : `${s / 86400 | 0}d`;
};
const key = s => `${s.source}/${s.id}`;
const pane = s => panes.find(p => key(p.s) === key(s));
const adding = ev => ev.ctrlKey || ev.metaKey;   // Ctrl/Cmd+click adds a column instead of replacing

const hue = p => {   // a project's colour: hashed from its path, so it never changes
  let h = 0;
  for (const c of p) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return (h % 310 + 300) % 360;   // skips 250-300: blue and purple only come out pastel, not neon
};
const paint = (node, project, color) => node.style.setProperty(...color ? ['--p', color] : ['--h', hue(project)]);
const title = s => (s.waiting ? '🔔 ' : '') + (s.depth ? '↳ ' : '') + s.title;   // bell: waiting for the human
const name = cwd => cwd.split('/').pop() || '(unknown)';   // a project's display name: its last directory
const paneTitle = s => `${name(s.project)}  ·  ${title(s)}`;   // project first, then the session

const stamp = ms => Date.now() - ms < 60e3 ? el('span', 'live', '● live') : el('span', '', ago(ms));

function renderProjects() {
  const groups = new Map();
  for (const s of sessions) {
    const g = groups.get(s.project) ?? { cwd: s.project, color: s.color, n: 0, updated: 0 };
    g.n += !s.depth;
    g.updated = Math.max(g.updated, s.updated);
    groups.set(s.project, g);
  }
  const rows = [...groups.values()].sort((a, b) => b.updated - a.updated);
  for (const p of projects) if (!groups.has(p)) projects.delete(p);   // no sessions left
  $('proj').firstElementChild.textContent = '▾ ' + (projects.size
    ? rows.filter(g => projects.has(g.cwd)).map(g => name(g.cwd)).join(', ')
    : `All projects (${rows.reduce((n, g) => n + g.n, 0)})`);
  const box = $('projs'), sig = rows.map(g => g.cwd + g.n + g.color).join();
  if (box.dataset.sig !== sig) {   // rebuilt only on change, to keep its scroll position and focus
    box.dataset.sig = sig;
    box.replaceChildren(...rows.map(g => {
      const l = el('label'), c = el('input'), sw = el('span', 'sw');
      c.type = 'checkbox';
      c.onchange = () => { projects[c.checked ? 'add' : 'delete'](g.cwd); renderList(); };
      paint(sw, g.cwd, g.color);
      l.append(c, sw, `${name(g.cwd)} (${g.n})`);
      l.title = g.cwd;
      return l;
    }));
  }
  rows.forEach((g, i) => box.children[i].firstChild.checked = projects.has(g.cwd));
}

const shown = () => {   // the sessions the sidebar lists, after the project filter and the search box
  const q = $('q').value.toLowerCase();
  return sessions.filter(s => (!projects.size || projects.has(s.project)) && (s.title + s.cwd).toLowerCase().includes(q));
};

function renderList() {
  renderProjects();
  $('list').replaceChildren(...shown().map(s => {
    const d = el('div', 's' + (pane(s) ? ' active' : ''));
    paint(d, s.project, s.color);
    d.style.paddingLeft = 10 + s.depth * 16 + 'px';
    const sub = el('div', 'sub');
    const cwd = el('span', 'cwd', name(s.project));   // the project, so a subagent in a subdirectory still shows it
    cwd.title = s.cwd;
    sub.append(el('span', 'src ' + s.source, s.source), cwd, stamp(s.updated));
    d.append(el('div', 'ti', title(s)), sub);
    d.title = s.title;
    d.onclick = ev => adding(ev) ? toggle(s) : select(s);
    return d;
  }));
}

async function loadSessions() {
  sessions = await (await fetch('/api/sessions')).json();
  // Subagents follow their parent's project and its colour (the list arrives parent-first).
  let root;
  for (const s of sessions) ({ cwd: s.project, color: s.color } = s.depth ? root : root = s);
  if (!panes.length && location.hash) {
    const h = location.hash.slice(1), find = k => sessions.find(s => key(s) === decodeURIComponent(k));
    const whole = find(h);   // old single-session hashes were not encoded, so may contain a comma
    const found = whole ? [whole] : h.split(',').map(find).filter(Boolean);
    if (found.length) {
      projects = new Set(found.every(s => s.project === found[0].project) ? [found[0].project] : []);
      found.forEach(openPane);
      return sync();
    }
  }
  let gone = false;
  for (const p of [...panes]) {   // a session that vanished drops its column; the rest carry on
    const s = sessions.find(s => key(s) === key(p.s));
    if (s) p.ti.textContent = paneTitle(p.s = s); else { closePane(p); gone = true; }
  }
  gone ? sync() : renderList();
}

function openPane(s) {
  const p = { s, cursor: 0, byId: new Map(), node: el('div', 'pane'), box: el('div', 'events'),
              ti: el('span', 'ti', paneTitle(s)), tl: el('div', 'tl'), st: el('div', 'strip') };
  p.box.onscroll = () => inView(p);
  p.ti.title = s.cwd;
  const head = el('div', 'ph'), f = el('button', '', '⤢'), x = el('button', '', '×');
  f.title = 'Focus: show only this pane (Esc to go back)';
  f.onclick = () => focus(focused === p ? null : p);
  x.title = 'Close';
  x.onclick = () => { closePane(p); sync(); };
  head.append(p.ti, f, x);
  const grip = el('div', 'grip');   // drag a column's left edge to trade width with the column before it
  grip.onpointerdown = ev => {
    const a = p.node.previousElementSibling, b = p.node, wa = a.offsetWidth, wb = b.offsetWidth, x = ev.clientX;
    const grow = +getComputedStyle(a).flexGrow + +getComputedStyle(b).flexGrow;   // widths follow flex-grow
    grip.setPointerCapture(ev.pointerId);
    ev.preventDefault();   // no text selection while dragging
    grip.onpointermove = ev => {
      const d = Math.max(80 - wa, Math.min(wb - 80, ev.clientX - x));   // keep both at least 80px wide
      a.style.flexGrow = grow * (wa + d) / (wa + wb);
      b.style.flexGrow = grow * (wb - d) / (wa + wb);
    };
  };
  grip.onpointerup = () => grip.onpointermove = null;
  paint(p.node, s.project, s.color);
  p.node.append(grip, head, p.tl, p.st, p.box);
  $('panes').append(p.node);
  panes.push(p);
  poll(p).catch(console.error);
}

function closePane(p) {
  if (p === focused) focus(null);
  p.node.remove();
  panes.splice(panes.indexOf(p), 1);
}

function select(s) {
  [...panes].forEach(closePane);
  openPane(s);
  sync();
}

function toggle(s) {
  const p = pane(s);
  p ? closePane(p) : openPane(s);
  sync();
}

// Show one pane alone (sidebar hidden too), or null for all of them again. Hidden panes keep polling;
// display: none loses their scroll positions, so those are saved here and put back, following the bottom
// for panes that were at it or opened meanwhile.
function focus(p) {
  if (p && !focused) for (const q of panes) q.top = atBottom(q.box) ? null : q.box.scrollTop;
  const was = focused;
  focused = p;
  document.body.classList.toggle('focus', !!p);
  for (const q of panes) q.node.classList.toggle('focused', q === p);
  if (!p) for (const q of panes) if (q !== was) q.box.scrollTop = q.top ?? q.box.scrollHeight;
}

function openLive() {   // panes become the live top-level sessions listed; ones already open keep their place
  focus(null);
  const want = shown().filter(s => s.live && !s.depth), keep = new Set(want.map(key));
  for (const p of [...panes]) if (!keep.has(key(p.s))) closePane(p);
  for (const s of want) if (!pane(s)) openPane(s);
  sync();
}

function sync() {
  location.hash = panes.map(p => encodeURIComponent(key(p.s))).join(',');
  renderList();
}

const atBottom = box => box.scrollHeight - box.scrollTop - box.clientHeight < 80;

async function poll(p) {
  const first = p.cursor === 0;
  const r = await fetch(`/api/events?source=${p.s.source}&id=${encodeURIComponent(p.s.id)}&cursor=${p.cursor}`);
  if (!r.ok) throw new Error(await r.text());
  const data = await r.json();
  if (!panes.includes(p)) return;   // closed mid-request
  p.cursor = data.cursor;
  const box = p.box, follow = atBottom(box);
  data.events.forEach(e => upsert(p, e));
  if (first || follow) box.scrollTop = box.scrollHeight;   // follow live output unless this column is scrolled up
  if (data.events.length) {
    const w = walk(p);
    p.tl.textContent = summary(w);
    p.tl.title = p.tl.textContent && p.tl.textContent + '\n\n' + LEGEND;   // in full: narrow panes cut the line
    strip(p, w);
  }
}

const IDLE = 5 * 60e3;   // ponytail: one fixed threshold, so a single model call over 5 min counts as idle too
const ASKS = ['AskUserQuestion', 'ExitPlanMode'];   // tool calls that wait for your answer rather than run
// The end of a turn in Claude Code, Codex, Claude Code (when the last block was thinking, which isn't sent) and opencode
const turnEnd = e => e.extra?.stop_reason === 'end_turn' || e.extra?.phase === 'final_answer'
  || e.name === 'turn_duration' || e.name === 'idle';
const LEGEND = `model: generating or thinking
tools: tool calls running
you: waiting for your prompt, or your answer to a question
background: turn over, waiting on subagents or background tasks
idle: gaps over 5 min, left out of active
ctx: context size at the last API call`;
const dur = ms => {   // 45s, 12m, 1h12m, 2d3h
  const m = Math.round(ms / 60e3);
  return m < 1 ? `${Math.round(ms / 1e3)}s` : m < 60 ? `${m}m`
    : m < 1440 ? `${m / 60 | 0}h${m % 60}m` : `${m / 1440 | 0}d${m / 60 % 24 | 0}h`;
};

// Where a pane's time went: the gaps between its timestamps as segments {t0, t1, kind, e}, each charged to what
// was pending when it began: a tool call, a question to you, or else the model. After a turn ends the wait is
// yours if your prompt ends it, and background if something else (a task notification) wakes the agent.
// e is the row a click on the segment goes to: the call for tools, else the event that ended the gap.
// ctx holds [index of the next segment, context size] per API call.
function walk(p) {
  const pts = [];   // [time, event, is the end of a tool call]
  for (const { e } of p.byId.values()) {
    if (e.ts) pts.push([+new Date(e.ts), e]);
    if (e.end) pts.push([+new Date(e.end), e, true]);
  }
  pts.sort((a, b) => a[0] - b[0]);
  const segs = [], ctx = [], open = new Set();
  let last = pts[0]?.[0], done = false, waits = [], win = 0, compactions = 0;
  for (const [at, e, end] of pts) {
    const calls = [...open], ask = calls.find(c => ASKS.includes(c.name));
    const kind = at - last > IDLE && !calls.some(c => c.end) ? 'idle'   // inside a call that did finish, a real wait
      : done ? 'wait' : ask ? 'you' : calls.length ? 'tools' : 'model';
    if (at > last) segs.push({ t0: last, t1: at, kind, e: ask || calls[0] || e });
    if (at > last && kind === 'wait') waits.push(segs.at(-1));
    last = at;
    if (end) { open.delete(e); continue; }
    if (done && !['meta', 'system'].includes(e.kind)) {   // working again: what woke it?
      for (const s of waits) Object.assign(s, { kind: e.kind === 'user' ? 'you' : 'background', e });
      done = false;
      waits = [];
    }
    if (e.kind === 'tool') open.add(e);
    if (turnEnd(e)) { done = true; open.clear(); }
    const u = e.extra?.usage, k = e.extra?.tokens, c = e.extra?.last_token_usage;   // Claude Code, opencode, Codex
    const n = u ? (u.input_tokens || 0) + (u.cache_read_input_tokens || 0) + (u.cache_creation_input_tokens || 0)
      : k ? (k.input || 0) + (k.cache?.read || 0) + (k.cache?.write || 0) : c?.input_tokens;
    if (n) ctx.push([segs.length, n]);
    win = e.extra?.model_context_window || win;
    compactions += ['compact_boundary', 'compaction'].includes(e.name);
  }
  for (const s of waits) s.kind = 'you';   // still waiting on whatever comes next
  return { segs, ctx, win, compactions };
}

function summary({ segs, ctx, win, compactions }) {
  const t = { model: 0, tools: 0, you: 0, background: 0, idle: 0 };
  for (const s of segs) t[s.kind] += s.t1 - s.t0;
  const active = t.model + t.tools + t.you + t.background, kt = n => `${Math.round(n / 1e3)}k`;
  const now = ctx.at(-1)?.[1], peak = Math.max(0, ...ctx.map(c => c[1]));
  if (!active) return '';
  return [
    'active ' + dur(active) + ': ' + ['model', 'tools', 'you', 'background'].filter(x => t[x] >= 500).map(x => `${x} ${dur(t[x])}`).join(', '),
    t.idle && 'idle ' + dur(t.idle),
    peak && [`ctx ${kt(now)}${win ? '/' + kt(win) : ''}`, peak > now && 'peak ' + kt(peak),
             compactions && `compacted ${compactions}×`].filter(Boolean).join(', '),
  ].filter(Boolean).join(' · ');
}

const svg = (tag, attrs) => {
  const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
};

// The walk drawn along active time: a band coloured by what was pending, and the context size as a line under
// it, scaled to the window when known, else to the peak. Idle gaps shrink to a sliver, so days-long sessions fit.
// The SVG stretches to the pane's width; CSS hides it in narrow panes.
function strip(p, { segs, ctx, win }) {
  const active = segs.reduce((a, s) => a + (s.kind === 'idle' ? 0 : s.t1 - s.t0), 0);
  p.st.replaceChildren();
  p.tx = null;
  if (!active) return;
  const brk = active * Math.min(.01, .15 / segs.filter(s => s.kind === 'idle').length);   // all idle: 15% at most
  const xs = [0];   // where each segment starts, and the end
  for (const s of segs) xs.push(xs.at(-1) + (s.kind === 'idle' ? brk : s.t1 - s.t0));
  const W = xs.at(-1), g = svg('svg', { viewBox: `0 0 ${W} 40`, preserveAspectRatio: 'none' });
  segs.forEach((s, i) => {
    const r = svg('rect', { x: xs[i], width: xs[i + 1] - xs[i], height: s.kind === 'idle' ? 40 : 12,
                            class: s.kind + (s.kind === 'tools' && s.e.error ? ' err' : '') });
    r.append(svg('title', {}));
    r.firstChild.textContent = `${s.kind} ${dur(s.t1 - s.t0)}\n${s.e.name || s.e.kind}: ${brief(s.e).slice(0, 100)}`;
    r.onclick = () => {
      const node = p.byId.get(s.e.id)?.node;
      if (node) { node.open = true; node.scrollIntoView({ block: 'start' }); }
    };
    g.append(r);
  });
  const top = win || Math.max(...ctx.map(c => c[1]));
  let line = '', y = 38;
  for (const [i, n] of ctx) line += `${xs[i]},${y} ${xs[i]},${y = 38 - 24 * n / top} `;   // a step per API call
  if (ctx.length) g.append(svg('polyline', { points: line + `${W},${y}`, class: 'ctx' }));
  p.view = svg('rect', { height: 40, class: 'view' });
  g.append(p.view);
  p.st.append(g);
  p.tx = t => {   // a time -> its x on the strip
    const i = segs.findIndex(s => t <= s.t1);
    return i < 0 ? W : xs[i] + (segs[i].kind === 'idle' ? 0 : Math.max(0, t - segs[i].t0));
  };
  inView(p);
}

function inView(p) {   // outline the part of the strip that the event list shows
  if (!p.tx) return;
  const box = p.box.getBoundingClientRect(), ts = [];
  for (const n of p.box.children) {
    const r = n.getBoundingClientRect();
    if (r.top > box.bottom) break;
    if (r.height && r.bottom > box.top && n.dataset.ts) ts.push(+n.dataset.ts);
  }
  if (!ts.length) return p.view.setAttribute('width', 0);
  const x0 = p.tx(ts[0]), x1 = p.tx(ts.at(-1));
  p.view.setAttribute('x', x0);
  p.view.setAttribute('width', x1 - x0);
}

function upsert(p, e) {
  if (e.kind === 'result') {   // Claude logs tool results as separate records; fold into the call
    const call = p.byId.get(e.tool);
    e = call ? { ...call.e, output: e.output, error: e.error, end: e.ts }
             : { ...e, kind: 'tool', name: 'tool result', end: e.ts };
  }
  const old = p.byId.get(e.id), json = JSON.stringify(e);
  if (old && old.json === json) return;
  const node = row(e);
  if (old) { node.open = old.node.open; old.node.replaceWith(node); }
  else p.box.append(node);
  p.byId.set(e.id, { e, json, node });
}

function brief(e) {
  if (e.kind !== 'tool') return (e.text || '').trim().slice(0, 400);
  const i = e.input || {};
  const arg = i.description ?? i.command ?? i.file_path ?? i.filePath ?? i.path ?? i.pattern ?? i.url ?? i.query
    ?? i.prompt ?? Object.values(i).find(v => typeof v === 'string') ?? '';
  return String(arg).slice(0, 400);
}

function time(ts) {
  const t = el('span', 't', ts ? new Date(ts).toLocaleTimeString() : '');
  if (ts) t.title = new Date(ts).toLocaleString();
  return t;
}

function row(e) {
  const d = el('details', `ev ${e.kind}${e.error ? ' err' : ''}`);
  if (e.ts) d.dataset.ts = +new Date(e.ts);   // in ms, for the strip's in-view outline
  const s = el('summary');
  s.append(el('span', 'k', e.kind === 'tool' || !['user', 'assistant', 'thinking'].includes(e.kind) ? e.name || e.kind : e.kind),
           time(e.ts),
           el('span', 'b', brief(e)));
  if (e.kind === 'tool')
    s.append(el('span', 'r', e.output == null ? 'running…'
      : `${e.error ? '✗' : '✓'} ${e.output ? e.output.split('\n').length : 0} lines`));
  d.append(s);
  // Bodies can be huge; build them only when first opened.
  d.addEventListener('toggle', () => { if (d.open && d.children.length === 1) d.append(body(e)); });
  // Clicking the expanded area around the content collapses it (but not while selecting text).
  d.addEventListener('click', ev => {
    if (ev.target.closest('.body') && !ev.target.closest('pre') && !getSelection().toString()) d.open = false;
  });
  d.open = expanded;
  return d;
}

function body(e) {
  const b = el('div', 'body');
  const sec = (label, v) => {
    if (v == null || v === '') return;
    if (label) b.append(el('h4', '', label));
    b.append(el('pre', '', typeof v === 'string' ? v : JSON.stringify(v, null, 2)));
  };
  sec(null, e.text);
  if (e.kind === 'tool') {
    // description first: it gives context before the command itself
    const input = Object.entries(e.input || {}).sort(([a], [b]) => (b === 'description') - (a === 'description'));
    for (const [k, v] of input) sec('input · ' + k, v);
    sec(e.error ? 'error' : 'output', e.output ?? '(no result yet)');
  }
  sec('details', e.extra);
  return b;
}

$('q').oninput = renderList;
for (const grip of document.querySelectorAll('body > .grip')) {   // drag to set the width of the sidebar before it
  grip.onpointerdown = ev => {
    const a = grip.previousElementSibling, w = a.offsetWidth, x = ev.clientX;
    grip.setPointerCapture(ev.pointerId);
    ev.preventDefault();
    grip.onpointermove = ev => a.style.width = Math.max(80, w + ev.clientX - x) + 'px';
  };
  grip.onpointerup = () => grip.onpointermove = null;
}
$('meta').onchange = e => $('panes').classList.toggle('show-meta', e.target.checked);
$('live').onclick = openLive;
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && focused) focus(null); });
$('expand').onclick = () => {
  expanded = !expanded;
  $('expand').textContent = expanded ? 'Collapse all' : 'Expand all';
  for (const p of panes) for (const { node } of p.byId.values()) node.open = expanded;
};

async function loop(fn, ms) {
  try { await fn(); } catch (err) { console.error(err); }
  setTimeout(loop, ms, fn, ms);
}
loop(loadSessions, 5000);
loop(() => Promise.all(panes.map(p => poll(p).catch(console.error))), 1500);
</script>
