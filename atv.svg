<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <rect width="720" height="240" rx="12" fill="#14161a"/>

  <text x="28" y="58" font-size="40" font-weight="700" fill="#d6d9de" letter-spacing="4">ATV</text>
  <text x="30" y="80" font-size="13" fill="#7d8590">agent trajectory visualizer</text>

  <!-- stars -->
  <g fill="#7d8590">
    <circle cx="310" cy="40" r="1.5"/><circle cx="388" cy="72" r="1"/><circle cx="470" cy="34" r="1.5"/>
    <circle cx="560" cy="58" r="1"/><circle cx="640" cy="30" r="1.5"/><circle cx="690" cy="70" r="1"/>
  </g>

  <!-- terrain -->
  <polygon points="0,196 80,182 160,194 240,176 320,186 400,160 520,128 600,140 720,112 720,240 0,240" fill="#1c1f25"/>

  <!-- the trail so far: one node per turn -->
  <polyline points="0,196 80,182 160,194 240,176 320,186 400,160" fill="none" stroke="#7d8590" stroke-width="2" stroke-dasharray="6 5"/>
  <g font-size="10" text-anchor="middle">
    <circle cx="80" cy="182" r="6" fill="#6ea8fe"/><text x="80" y="168" fill="#6ea8fe">user</text>
    <circle cx="160" cy="194" r="6" fill="#e0b354"/><text x="160" y="180" fill="#e0b354">tool</text>
    <circle cx="240" cy="176" r="6" fill="#e0b354"/><text x="240" y="162" fill="#e0b354">tool</text>
    <circle cx="320" cy="186" r="6" fill="#5fd38d"/><text x="320" y="172" fill="#5fd38d">assistant</text>
  </g>

  <!-- the trail ahead: not ridden yet -->
  <polyline points="520,128 600,140 720,112" fill="none" stroke="#3a3f48" stroke-width="2" stroke-dasharray="2 6"/>
  <g fill="#14161a" stroke="#3a3f48" stroke-width="2">
    <circle cx="600" cy="140" r="5"/><circle cx="690" cy="119" r="5"/>
  </g>

  <!-- the quad, climbing -->
  <g transform="translate(415,156) rotate(-15)" stroke-linecap="round" stroke-linejoin="round">
    <g fill="#7d8590" opacity=".45">
      <circle cx="-12" cy="-6" r="6"/><circle cx="-28" cy="-12" r="8"/><circle cx="-46" cy="-7" r="5"/><circle cx="-60" cy="-14" r="3"/>
    </g>
    <polygon points="98,-38 150,-50 150,-22" fill="#ffe9a8" opacity=".12"/>
    <path d="M-4,-28 Q16,-52 38,-28 Z M58,-28 Q78,-52 100,-28 Z" fill="#e0b354"/>
    <rect x="10" y="-36" width="78" height="13" rx="6" fill="#e0b354"/>
    <rect x="16" y="-43" width="32" height="8" rx="4" fill="#7d8590"/>
    <g fill="none" stroke="#d6d9de" stroke-width="4">
      <path d="M70,-36 L62,-58 M56,-60 L68,-57"/>
      <path d="M32,-43 L44,-68 L61,-58 M32,-43 L50,-30"/>
    </g>
    <circle cx="47" cy="-77" r="9" fill="#6ea8fe"/>
    <path d="M49,-80 h7 v5 h-7 z" fill="#14161a"/>
    <circle cx="97" cy="-36" r="3" fill="#ffe9a8"/>
    <g fill="#101216" stroke="#d6d9de" stroke-width="4" stroke-dasharray="4 3">
      <circle cx="16" cy="-16" r="16"/><circle cx="78" cy="-16" r="16"/>
    </g>
    <g fill="#7d8590"><circle cx="16" cy="-16" r="4"/><circle cx="78" cy="-16" r="4"/></g>
  </g>
</svg>
